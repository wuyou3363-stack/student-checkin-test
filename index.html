 let count=Number(r['目标数量']);return {kind:'normal',label:subject+action+(Number.isFinite(count)&&count>0?count+'个':'')};
}
function group(){let map=new Map();for(const r of records){if(String(r['完成状态']).trim()!=='已完成')continue;let raw=r['学生姓名']||'';if(!map.has(raw))map.set(raw,{name:normName(raw),grade:getGrade(raw),books:new Map(),extras:new Map(),total:0});let s=map.get(raw);s.total++;let t=type(r);if(t.kind==='extra'){s.extras.set(t.key,(s.extras.get(t.key)||0)+1);continue}let b=book(r['教材名称'])||'教材',u=unit(r['单元名称'])||'其他';if(!s.books.has(b))s.books.set(b,new Map());let units=s.books.get(b);if(!units.has(u))units.set(u,[]);if(!units.get(u).includes(t.label))units.get(u).push(t.label)}return [...map.values()].sort((a,b)=>(a.grade||'9').localeCompare(b.grade||'9')||a.name.localeCompare(b.name,'zh-CN'))}
function extraLines(s){return [...s.extras].map(([k,n])=>k==='完成音标学习'?k+(n===1?'一个':n+'个'):k+n+(k==='完成课文跟读'||k==='完成同步练习'?'篇':'个'))}
function lines(s){let a=[s.name,...s.books.keys()].length? [s.name]:[s.name];for(const [b,units] of s.books){a.push('今日学习'+b);for(const [u,tags] of units){a.push(u,...tags)}}a.push(...extraLines(s));return a.join('\n')}
function render(){let all=group(),selected=all.filter(s=>(grade==='全部'||s.grade===grade)&&s.name.toLowerCase().includes(query));$('grades').innerHTML=['全部','3','4','5','6'].map(g=>'<button class="pill '+(grade===g?'active':'')+'" data-grade="'+g+'">'+(g==='全部'?'全部年级':g+'年级')+'</button>').join('')+'<span class="stats">共 '+selected.length+' 名已打卡学生</span>';
 $('summary').innerHTML='<span>已完成任务 '+all.reduce((a,s)=>a+s.total,0)+' 项</span><span>已打卡 '+all.length+' 人</span>';
 $('cards').innerHTML=selected.map((s,i)=>'<article class="card"><div class="head"><div class="name">'+esc(s.name)+'</div><div class="grade">'+esc(s.grade||'其他')+'年级</div></div>'+[...s.books].map(([b,units])=>'<div class="book">今日学习 '+esc(b)+'</div>'+[...units].map(([u,tags])=>'<div class="unit">'+esc(u)+'</div><div class="tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>').join('')).join('')+(s.extras.size?'<div class="extras">'+extraLines(s).map(esc).join('<div></div>')+'</div>':'')+'<button class="copy" data-index="'+i+'">📋 复制学生打卡记录</button></article>').join('');$('empty').hidden=selected.length!==0;
 document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{grade=b.dataset.grade;render()});document.querySelectorAll('[data-index]').forEach(b=>b.onclick=async()=>{let txt=lines(selected[Number(b.dataset.index)]);try{await navigator.clipboard.writeText(txt);b.textContent='✓ 已复制';setTimeout(()=>b.textContent='📋 复制学生打卡记录',1600)}catch{let ta=document.createElement('textarea');ta.value=txt;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='✓ 已复制'}})}
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let out=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=false;else cell+=c}else if(c==='"')quote=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
$('csv').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let txt=await f.text(),rows=parseCSV(txt),heads=rows.shift()||[],needed=['学生姓名','完成状态','任务项目','学习类型'];if(!needed.every(x=>heads.includes(x))){$('status').textContent='CSV 缺少必要列，请选择顺势学生任务明细 CSV';return}records=rows.map(row=>Object.fromEntries(heads.map((h,i)=>[h,row[i]||'']))).filter(r=>r['完成状态'].trim()==='已完成').map(r=>Object.fromEntries(['学生姓名','任务项目','教材名称','教材版本','单元名称','学习类型','任务分类','完成状态','目标数量'].map(k=>[k,r[k]||''])));date=(rows[0]||[])[heads.indexOf('查询日期')]||f.name.match(/\d{4}-\d{2}-\d{2}/)?.[0]||'更新日期';$('date').textContent=date;grade='全部';query='';$('search').value='';render();$('download').disabled=false;$('status').textContent='已读取 '+rows.length+' 条，已完成 '+records.length+' 条。点击下载后上传到 GitHub。'});
$('download').onclick=()=>{let doc=document.documentElement.cloneNode(true);doc.querySelector('#seed').textContent=JSON.stringify(records).replace(/</g,'\\u003c');doc.querySelector('#date').textContent=date;doc.querySelector('#csv').value='';doc.querySelector('#status').textContent='选择新 CSV 后，可生成新版网页上传 GitHub。';doc.querySelector('#download').disabled=true;doc.querySelector('#search').value='';doc.querySelector('#cards').innerHTML='';doc.querySelector('#grades').innerHTML='';doc.querySelector('#summary').innerHTML='';let source='<!doctype html>\n'+doc.outerHTML;let blob=new Blob([source],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
